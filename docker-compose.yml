version: "3.8"

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: geo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: geo_project
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: geo-backend
    ports:
      - "3000:3000"
    environment:
      DB_USER: postgres
      DB_HOST: db
      DB_NAME: geo_project
      DB_PASSWORD: "123456"
      DB_PORT: 5432
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: geo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
